[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinkflag"
version = "0.1.0"
description = "Get the receipts: end-to-end NLP system (web scraping, multi-dataset training, fine-tuned DeBERTa, LLM agent) that explains manipulation patterns in dating chats"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]
tracking = ["mlflow>=2.12"]
# 📞 Call Sisi, fully local: Whisper (ears) + Piper (voice)
voice = ["faster-whisper>=1.1", "piper-tts>=1.3", "av>=12,<14"]
ml = ["torch>=2.3", "transformers>=4.44", "accelerate>=0.33", "sentencepiece>=0.2"]

[project.scripts]
pinkflag-train = "pinkflag.train:main"
pinkflag-predict = "pinkflag.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
