# Fine-tune a multilingual transformer on the merged dataset.
experiment: pinkflag-transformer
seed: 42

data:
  train: data/processed/train.csv
  val: data/processed/val.csv
  test: data/processed/test.csv

model_name: xlm-roberta-base   # multilingual: English, Arabic, French... (100 languages)
max_length: 192                # tokens; MentalManip dialogues are long, texts are short

train:
  epochs: 15                   # run 1 (6 epochs) was still improving at the end = undertrained
  batch_size: 16
  lr: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  class_weights: balanced      # rare labels (controlling, breadcrumbing) count more
  early_stopping_patience: 3  # stop if val macro-F1 doesn't improve for 2 epochs
  fp16: true                   # half precision on GPU: faster, less memory

output:
  model_dir: models/transformer
  report_path: reports/transformer_metrics.json
